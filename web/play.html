<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parlour</title>
<meta name="description" content="Join a Parlour quiz on your phone.">
<meta name="theme-color" content="#2B160C">
<link rel="icon" href="icon.svg?v=2" type="image/svg+xml">
<link rel="preload" href="fonts/caprasimo-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/outfit-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="base.css?v=7">
<link rel="stylesheet" href="play.css?v=19">
</head>
<body>
<main id="app">

  <form id="s-join" class="screen join" autocomplete="off" hidden>
    <header class="top"><h1 class="wordmark">Parlour</h1></header>
    <!-- A code from the link: shown, not asked for. Tap to type another. -->
    <button class="room-line" id="f-room" type="button" hidden><span>Room</span><b class="num" id="f-room-code"></b><span class="change">Change</span></button>
    <label class="field" id="f-code-field">
      <span>Room code</span>
      <input id="f-code" class="code-in num" maxlength="4" autocapitalize="characters" spellcheck="false" inputmode="text" enterkeyhint="next" placeholder="····">
    </label>
    <label class="field">
      <span>Your name</span>
      <input id="f-name" maxlength="14" autocapitalize="words" spellcheck="false" enterkeyhint="go">
    </label>
    <!-- Who to be: one is already picked, so there is nothing that has to be done here. -->
    <div class="pick" id="f-faces-field" hidden>
      <span class="pick-label" id="f-faces-label">Your character<i class="more"> · scroll for more</i></span>
      <div class="faces" id="f-faces" role="group" aria-labelledby="f-faces-label"></div>
    </div>
    <button class="btn primary" id="f-go" type="submit">Join</button>
    <button class="btn" id="f-cancel" type="button" hidden>Cancel</button>
    <p class="error" id="f-error" role="alert"></p>
    <div class="foot">
      <p class="small">Hosting? Open <strong id="host-link"></strong>/host on the TV or a computer.</p>
      <nav class="legal" aria-label="Legal"><a href="https://teloone.au/apps/parlour/privacy/" rel="noreferrer">Privacy</a><span aria-hidden="true">·</span><a href="https://teloone.au/apps/parlour/terms/" rel="noreferrer">Terms</a></nav>
    </div>
  </form>

  <section id="s-play" class="screen play" hidden>
    <!-- Stays at the top when big text makes the page scroll: who you are, the time left, the remote. -->
    <div class="head">
      <header class="top">
        <span class="me" id="me"></span>
        <span class="score num" id="my-score"></span>
        <!-- For the remote, through a game: End has to be held (play.js), Pause is one tap. -->
        <button class="end-pill hold" id="r-stop" type="button" hidden>End</button>
        <button class="icon-btn" id="r-pause" type="button" data-r="pause" aria-label="Pause" hidden><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M7 4.5v11M13 4.5v11"/></svg></button>
      </header>
      <!-- For the remote: the game is paused, and what to do about it. -->
      <div class="pausebar" id="pausebar" hidden>
        <div class="pause-do" id="pause-do">
          <button class="btn primary" type="button" data-r="resume">Resume</button>
          <button class="btn" type="button" data-r="skip">Next</button>
          <button class="link" type="button" id="r-end">End game</button>
        </div>
        <div class="pause-do" id="pause-sure" hidden>
          <span>End now and show the scores?</span>
          <button class="btn primary" type="button" data-r="stop">End game</button>
          <button class="link" type="button" id="r-keep">Cancel</button>
        </div>
      </div>
      <div class="timer" id="timer" hidden><i></i></div>
    </div>
    <div class="stage" id="stage"></div>
  </section>

  <section id="s-gone" class="screen centre" hidden>
    <p class="big-note" id="gone-note"></p>
    <p class="sub" id="gone-hint"></p>
    <div class="scene" aria-hidden="true"></div>
    <button class="btn primary" id="gone-again">Join another room</button>
  </section>

</main>
<!-- The remote's topic picker: the headings as tabs, and the topics of the one shown (play.js draws both). -->
<dialog class="sheet" id="topics" aria-label="Topics">
  <div class="sheet-head"><h2 tabindex="-1" autofocus>Topics</h2><button class="icon-btn" type="button" id="topics-done" aria-label="Done"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m4 4 10 10M14 4 4 14"/></svg></button></div>
  <div class="tabs" id="topics-tabs"></div>
  <div class="checks" id="topics-list"></div>
</dialog>
<!-- The remote's holder hands it to another player: a list of who is here, nothing to type. -->
<dialog class="sheet" id="hand" aria-label="Hand over the remote">
  <div class="sheet-head"><h2 tabindex="-1" autofocus>Hand over the remote</h2><button class="icon-btn" type="button" id="hand-done" aria-label="Cancel"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m4 4 10 10M14 4 4 14"/></svg></button></div>
  <div class="whos" id="hand-list"></div>
</dialog>
<!-- Another character, from the lobby or the final scores. -->
<dialog class="sheet" id="faces" aria-label="Your character">
  <div class="sheet-head"><h2 tabindex="-1" autofocus>Your character</h2><button class="icon-btn" type="button" id="faces-done" aria-label="Done"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m4 4 10 10M14 4 4 14"/></svg></button></div>
  <div class="faces" id="faces-list"></div>
</dialog>
<p class="offline" id="offline" role="status" hidden>Reconnecting…</p>
<!-- What just changed, for screen readers: the stage is redrawn under them. -->
<p class="said" id="say" aria-live="polite"></p>
<script src="shared.js?v=17"></script>
<script src="faces.js?v=1"></script>
<script src="play.js?v=22"></script>
</body>
</html>
